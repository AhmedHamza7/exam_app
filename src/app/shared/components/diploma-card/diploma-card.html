<a
  class="diploma-card"
  [routerLink]="'/diplomas/exams/' + diploma().id"
  [style.background-image]="'url(' + diploma().image + ')'"
>
  <div class="diploma-info">
    <h3 class="diploma-title">{{ diploma().title }}</h3>
    <p class="diploma-description">{{ diploma().description }}</p>
  </div>
</a>
