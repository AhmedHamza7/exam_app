

<div class="header-wrapper">
  @if (headerBacklink()) {
    <button class="header-back" type="button" (click)="goBack()">
      <i class="pi pi-arrow-left"></i>
    </button>
  }
  <header class="header">
    <i class="header-icon {{ headerIcon() }}"></i>
    <h1 class="header-title">{{ headerTitle() }}</h1>
  </header>
</div>
